[tools]
erlang = "28.2"
rebar = "3.25.1"
gleam = "1.14.0"
watchexec = "2.3.2"

[env]
APP_ENV = "dev"
SERVER_PORT = 8000
DEBUG_LEVEL = "DEBUG"

[tasks.image]
run = 'podman build -t localhost/rtgo:latest -f Containerfile .'
[tasks.deploy]
run = [
  "sudo -n podman build -t rtgo -f Containerfile .",
  "sudo -n systemctl restart rtgo",
]

[tasks."client-config"]
dir = "client"
run = "cp config.${APP_ENV}.gleam src/config.gleam"
[tasks."dev:server"]
dir = "server"
run = """
watchexec --restart --verbose \
  --wrap-process=session --exts=gleam --debounce=100ms \
  -- gleam run
"""
[tasks."dev:client"]
depends = ["client-config"]
dir = "client"
run = "gleam run -m lustre/dev start"
[tasks.dev]
depends = ["dev:server", "dev:client"]

[tasks.build]
run = [
  "cd shared && gleam build",
  "cd server && gleam build",
  "cd client && gleam build",
  "ln -sf ../../../packages/lustre/priv client/build/dev/javascript/lustre/",
  "ln -sf ../../../packages/lustre_dev_tools/priv client/build/dev/javascript/lustre_dev_tools/",
]

[tasks."test:shared"]
dir = "shared"
run = "gleam test"
[tasks."test:server"]
run = "bash scripts/test-server.sh"
[tasks."test:client"]
dir = "client"
run = "gleam test"
[tasks."test:drag-input"]
dir = "client"
run = "node --test test/drag_ffi_test.mjs"
[tasks."test:katago-install"]
run = "bash scripts/test-install-katago.sh"
[tasks.test]
depends = ["test:shared", "test:server", "test:client", "test:drag-input", "test:katago-install"]
[tasks."test:single-view"]
description = "Test production scoring over 20 fresh-engine KataGo trials"
dir = "server"
run = "gleam run -m rtgo_server/single_view_adjudication_test"

[tasks."katago:install"]
description = "Install KataGo and its network from an existing local RTGO image into /opt/katago"
run = "bash scripts/install-katago.sh"

